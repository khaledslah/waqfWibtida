name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'WaqfReader_Grok/**'
      - '.github/workflows/build_ios.yml'

jobs:
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: WaqfReader_Grok
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install Dart/Flutter dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test

      - name: Precache iOS artifacts
        run: flutter precache --ios

      - name: Build unsigned iOS release app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          rm -rf Payload waqf_ibtida_*_unsigned.ipa
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -r -9 "waqf_ibtida_${VERSION}_unsigned.ipa" Payload
          rm -rf Payload
          ls -lh "waqf_ibtida_${VERSION}_unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: waqf-ibtida-ios-ipa
          path: WaqfReader_Grok/waqf_ibtida_*_unsigned.ipa
          retention-days: 30
