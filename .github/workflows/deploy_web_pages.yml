name: Deploy iOS PWA (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'WaqfReader_Grok/**'
      - '.github/workflows/deploy_web_pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WaqfReader_Grok
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install Dart/Flutter dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test

      - name: Build Flutter Web (CanvasKit PWA)
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          flutter build web --release --web-renderer canvaskit --base-href "/${REPO_NAME}/"
          touch build/web/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: WaqfReader_Grok/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
